name: build

on:
  push:
    # Avoid workflow run for _merged_ `dependabot` PRs.
    # They were (hopefully!) already tested in PR-triggered workflow.
    branches-ignore:
      - "dependabot/**"
  pull_request:
    paths-ignore:
      - "**.adoc"
      - "**.md"
      - "**.txt"

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: "Echo environment"
        run: |
          echo "${{github.event_name}}"
          echo "${{github.actor}}"
          echo "${{github.event.pull_request.html_url}}"
    
  build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: echo

    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        version: [17, 21, 25]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDKs
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          java-package: jdk
          architecture: x64
          cache: maven

      - name: Build
        shell: bash
        run: mvn --batch-mode clean verify
            
  build-result:
    if: always() && github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check that all matrix builds passed
        run: test "${{ needs.build.result }}" = "success"
